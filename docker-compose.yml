services:
  db:
    image: postgres:17-alpine
    container_name: moodle_db
    environment:
      POSTGRES_DB: moodle_import_app
      POSTGRES_USER: moodle_import_app
      POSTGRES_PASSWORD: moodle_import_app_pass
    ports:
      - "5432:5432"
    volumes:
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodle_backend
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: moodle_import_app
      DB_USER: moodle_import_app
      DB_PASSWORD: moodle_import_app_pass
    ports:
      - "8080:8080"
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public", "public/router.php"]
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: moodle_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    depends_on:
      - backend